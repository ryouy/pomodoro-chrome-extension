<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2b77c5">
  <title>集中タイマー</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div><p class="eyebrow">POMODORO TIMER</p><h1>集中タイマー</h1></div>
      <button id="settingsToggle" class="link-button" type="button">設定</button>
    </header>

    <section id="timerView">
      <div class="status-row"><span id="phaseLabel" class="phase-badge">作業</span><span id="setLabel">セット 1 / 4</span></div>
      <div class="timer-ring" aria-live="polite">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="94"/>
          <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="94"/>
        </svg>
        <div class="timer-content"><div id="timeDisplay" class="time-display">25:00</div><div id="statusText">準備完了</div></div>
      </div>
      <div class="primary-actions">
        <button id="startPauseButton" class="primary-button" type="button">スタート</button>
        <button id="resetButton" class="secondary-button" type="button">リセット</button>
      </div>
      <button id="skipButton" class="link-button skip-button" type="button">この区間をスキップ</button>
    </section>

    <section id="settingsView" hidden>
      <div class="settings-heading"><h2>設定</h2><small>変更後はタイマーをリセット</small></div>
      <form id="settingsForm">
        <div class="setting-section">
          <strong>タイマー</strong>
          <div class="duration-grid">
            <label>作業<span><input id="workMinutes" type="number" min="1" max="180" required><small>分</small></span></label>
            <label>休憩<span><input id="breakMinutes" type="number" min="1" max="60" required><small>分</small></span></label>
            <label>セット<span><input id="totalSets" type="number" min="1" max="12" required><small>回</small></span></label>
          </div>
        </div>

        <div class="setting-section sound-settings">
          <strong>音</strong>
          <label class="setting-row">終了音<span><select id="alarmSound"><option value="classic">クラシック</option><option value="digital">デジタル</option><option value="gentle">ジェントル</option><option value="bell">ベル</option><option value="crystal">クリスタル</option></select><button id="testSound" type="button">試聴</button></span></label>
          <label class="setting-row">休憩音<span><select id="birdSound"><option value="uguisu">ウグイス</option><option value="robin">コマドリ</option><option value="tit">シジュウカラ</option><option value="cuckoo">カッコウ</option><option value="sparrow">スズメ</option></select><button id="testBird" type="button">試聴</button></span></label>
        </div>

        <div class="setting-section theme-row">
          <strong>テーマ</strong>
          <div class="palette" role="radiogroup" aria-label="テーマカラー">
            <label style="--color:#2b77c5" title="アルパインブルー"><input type="radio" name="theme" value="alpine"><span></span></label>
            <label style="--color:#2f7c5d" title="フォレストグリーン"><input type="radio" name="theme" value="forest"><span></span></label>
            <label style="--color:#d36c33" title="サンライズオレンジ"><input type="radio" name="theme" value="sunrise"><span></span></label>
            <label style="--color:#5c64d6" title="トワイライトインディゴ"><input type="radio" name="theme" value="twilight"><span></span></label>
            <label style="--color:#c45f88" title="サクラローズ"><input type="radio" name="theme" value="sakura"><span></span></label>
          </div>
        </div>

        <div class="setting-section toggles">
          <label>サウンド<input id="soundEnabled" type="checkbox"></label>
          <label>通知<input id="notificationsEnabled" type="checkbox"></label>
        </div>
        <button class="primary-button save-button" type="submit">保存</button>
      </form>
    </section>

    <footer class="download-area">
      <button id="downloadExtension" class="download-button" type="button">Chrome拡張機能をダウンロード</button>
      <small>ZIPを展開してChromeに読み込めます</small>
    </footer>
  </main>
  <script src="download.js"></script>
  <script src="app.js"></script>
</body>
</html>
