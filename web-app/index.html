<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2b77c5">
  <title>集中タイマー</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>集中タイマー</h1>
      <button id="settingsToggle" class="link-button" type="button">設定</button>
    </header>

    <section id="timerView">
      <div class="phase-row"><span id="phaseLabel" class="phase-label">作業</span></div>
      <div class="timer-block" aria-live="polite">
        <div id="timeDisplay" class="time-display">25:00</div><div id="setLabel" class="set-label">1 / 4 セット</div>
      </div>
      <div class="primary-actions">
        <button id="startPauseButton" class="primary-button" type="button">スタート</button>
        <button id="pauseButton" class="secondary-button" type="button" disabled>一時停止</button>
      </div>
      <div class="secondary-actions">
        <button id="resetButton" class="link-button" type="button">リセット</button>
        <button id="skipButton" class="link-button" type="button">スキップ</button>
      </div>
    </section>

    <section id="settingsView" hidden>
      <div class="settings-heading"><h2>設定</h2></div>
      <form id="settingsForm">
        <div class="setting-section">
          <div class="duration-grid">
            <label><span class="duration-label">作業 <small>分</small></span><span class="number-stepper"><button class="step-button" type="button" data-target="workMinutes" data-delta="-1" aria-label="作業時間を減らす">−</button><input id="workMinutes" type="number" min="1" max="180" required aria-label="作業時間（分）"><button class="step-button" type="button" data-target="workMinutes" data-delta="1" aria-label="作業時間を増やす">＋</button></span></label>
            <label><span class="duration-label">休憩 <small>分</small></span><span class="number-stepper"><button class="step-button" type="button" data-target="breakMinutes" data-delta="-1" aria-label="休憩時間を減らす">−</button><input id="breakMinutes" type="number" min="1" max="60" required aria-label="休憩時間（分）"><button class="step-button" type="button" data-target="breakMinutes" data-delta="1" aria-label="休憩時間を増やす">＋</button></span></label>
            <label><span class="duration-label">セット <small>回</small></span><span class="number-stepper"><button class="step-button" type="button" data-target="totalSets" data-delta="-1" aria-label="セット数を減らす">−</button><input id="totalSets" type="number" min="1" max="12" required aria-label="セット数（回）"><button class="step-button" type="button" data-target="totalSets" data-delta="1" aria-label="セット数を増やす">＋</button></span></label>
          </div>
        </div>

        <div class="setting-section sound-settings">
          <label class="setting-row">開始音<span><select id="alarmSound"><option value="classic">クラシック</option><option value="digital">デジタル</option><option value="gentle">ジェントル</option><option value="bell">ベル</option><option value="crystal">クリスタル</option></select><button id="testSound" type="button" aria-label="開始音を試聴">▶</button></span></label>
          <label class="setting-row">休憩音<span><select id="birdSound"><option value="uguisu">ウグイス</option><option value="robin">コマドリ</option><option value="tit">シジュウカラ</option><option value="cuckoo">カッコウ</option><option value="sparrow">スズメ</option></select><button id="testBird" type="button" aria-label="休憩音を試聴">▶</button></span></label>
        </div>

        <div class="setting-section theme-row">
          <strong>テーマ</strong>
          <div class="palette" role="radiogroup" aria-label="テーマカラー">
            <label style="--color:#2b77c5" title="アルパインブルー"><input type="radio" name="theme" value="alpine"><span></span></label>
            <label style="--color:#2f7c5d" title="フォレストグリーン"><input type="radio" name="theme" value="forest"><span></span></label>
            <label style="--color:#d36c33" title="サンライズオレンジ"><input type="radio" name="theme" value="sunrise"><span></span></label>
            <label style="--color:#5c64d6" title="トワイライトインディゴ"><input type="radio" name="theme" value="twilight"><span></span></label>
            <label style="--color:#c45f88" title="サクラローズ"><input type="radio" name="theme" value="sakura"><span></span></label>
          </div>
        </div>

        <div class="setting-section toggles">
          <label>サウンド<input id="soundEnabled" type="checkbox"></label>
          <label>通知<input id="notificationsEnabled" type="checkbox"></label>
        </div>
        <button class="primary-button save-button" type="submit">保存</button>
      </form>
    </section>

    <footer class="download-area">
      <button id="downloadExtension" class="download-button" type="button">Chrome拡張機能をダウンロード</button>
      <a class="github-button" href="https://github.com/ryouy/pomodoro-chrome-extension" target="_blank" rel="noopener noreferrer">GitHub</a>
    </footer>
  </main>
  <script src="download.js"></script>
  <script src="app.js"></script>
</body>
</html>
