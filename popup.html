<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>シンプル・ポモドーロ</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">POMODORO TIMER</p>
        <h2>集中タイマー</h2>
      </div>
      <button id="settingsToggle" class="icon-button" type="button" aria-label="設定を開く" aria-expanded="false">設定</button>
    </header>

    <section id="timerView">
      <div class="status-row">
        <span id="phaseLabel" class="phase-badge">作業</span>
        <span id="setLabel" class="set-label">セット 1 / 4</span>
      </div>

      <div class="timer-ring" aria-live="polite">
        <svg viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="94"></circle>
          <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="94"></circle>
        </svg>
        <div class="timer-content">
          <div id="timeDisplay" class="time-display">25:00</div>
          <div id="statusText" class="status-text">準備完了</div>
        </div>
      </div>

      <div class="primary-actions">
        <button id="startPauseButton" class="primary-button" type="button">スタート</button>
        <button id="resetButton" class="secondary-button" type="button">リセット</button>
      </div>
      <button id="skipButton" class="text-button" type="button">この区間をスキップ</button>
    </section>

    <section id="settingsView" class="settings-panel" hidden>
      <div class="settings-heading">
        <h2>設定</h2>
        <span class="settings-heading-meta">
          <a href="https://simple-pomodoro-web.vercel.app" target="_blank" rel="noopener noreferrer">ウェブ版はこちら ↗</a>
          <small>変更後はタイマーをリセット</small>
        </span>
      </div>

      <form id="settingsForm">
        <div class="compact-section">
          <div class="section-label">タイマー</div>
          <div class="duration-grid">
            <label>
              <span>作業 <small>分</small></span>
              <span class="number-stepper">
                <button class="step-button" type="button" data-target="workMinutes" data-delta="-1" aria-label="作業時間を1分減らす">−</button>
                <input id="workMinutes" type="number" min="1" max="180" step="1" required aria-label="作業時間（分）">
                <button class="step-button" type="button" data-target="workMinutes" data-delta="1" aria-label="作業時間を1分増やす">＋</button>
              </span>
            </label>
            <label>
              <span>休憩 <small>分</small></span>
              <span class="number-stepper">
                <button class="step-button" type="button" data-target="breakMinutes" data-delta="-1" aria-label="休憩時間を1分減らす">−</button>
                <input id="breakMinutes" type="number" min="1" max="60" step="1" required aria-label="休憩時間（分）">
                <button class="step-button" type="button" data-target="breakMinutes" data-delta="1" aria-label="休憩時間を1分増やす">＋</button>
              </span>
            </label>
            <label>
              <span>セット <small>回</small></span>
              <span class="number-stepper">
                <button class="step-button" type="button" data-target="totalSets" data-delta="-1" aria-label="セット数を1回減らす">−</button>
                <input id="totalSets" type="number" min="1" max="12" step="1" required aria-label="セット数（回）">
                <button class="step-button" type="button" data-target="totalSets" data-delta="1" aria-label="セット数を1回増やす">＋</button>
              </span>
            </label>
          </div>
        </div>

        <div class="compact-section sound-section">
          <div class="section-label">音</div>
          <label class="compact-field">
            <span>終了音</span>
            <span class="select-with-test">
            <select id="alarmSound">
              <option value="classic">クラシック</option>
              <option value="digital">デジタル</option>
              <option value="gentle">ジェントル</option>
              <option value="bell">ベル</option>
              <option value="crystal">クリスタル</option>
            </select>
              <button id="testSoundButton" class="test-button" type="button" aria-label="アラーム音を試聴">試聴</button>
            </span>
          </label>
          <label class="compact-field">
            <span>休憩音</span>
            <span class="select-with-test">
              <select id="birdSound">
                <option value="uguisu">ウグイス</option>
                <option value="robin">コマドリ</option>
                <option value="tit">シジュウカラ</option>
                <option value="cuckoo">カッコウ</option>
                <option value="sparrow">スズメ</option>
              </select>
              <button id="testBirdButton" class="test-button" type="button" aria-label="鳥の声を試聴">試聴</button>
            </span>
          </label>
        </div>

        <div class="compact-section">
          <div class="theme-row">
            <span class="section-label">テーマ</span>
            <div class="theme-palette" role="radiogroup" aria-label="テーマカラー">
              <label class="theme-swatch" style="--swatch: #2b77c5" title="アルパインブルー">
                <input type="radio" name="theme" value="alpine" aria-label="アルパインブルー">
                <span aria-hidden="true"></span>
              </label>
              <label class="theme-swatch" style="--swatch: #2f7c5d" title="フォレストグリーン">
                <input type="radio" name="theme" value="forest" aria-label="フォレストグリーン">
                <span aria-hidden="true"></span>
              </label>
              <label class="theme-swatch" style="--swatch: #d36c33" title="サンライズオレンジ">
                <input type="radio" name="theme" value="sunrise" aria-label="サンライズオレンジ">
                <span aria-hidden="true"></span>
              </label>
              <label class="theme-swatch" style="--swatch: #5c64d6" title="トワイライトインディゴ">
                <input type="radio" name="theme" value="twilight" aria-label="トワイライトインディゴ">
                <span aria-hidden="true"></span>
              </label>
              <label class="theme-swatch" style="--swatch: #c45f88" title="サクラローズ">
                <input type="radio" name="theme" value="sakura" aria-label="サクラローズ">
                <span aria-hidden="true"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="compact-section toggles-section">
          <label class="toggle-row"><span>音を鳴らす</span><input id="soundEnabled" class="toggle" type="checkbox"></label>
          <label class="toggle-row"><span>通知</span><input id="notificationsEnabled" class="toggle" type="checkbox"></label>
        </div>

        <button class="primary-button save-button" type="submit">保存</button>
      </form>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
